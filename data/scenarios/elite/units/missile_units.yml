schema_version: 1
domain: units
resources:
  - supplies
  - components
  - fuel
  - rares
  - electronics
  - cash
  - manpower
units:
  # === WARHEAD PROGRAMS ===
  # Sequential research chain: conventional → chemical → nuclear
  # These are single-level consumable units (auto-consumed when a missile fires).
  # Batch sizes vary per type (x4 / x3 / x2) — schema field pending.

  conventional_warhead:
    name: Conventional Warhead
    category: Missile
    doctrine:
      - western
      - eastern
      - european
    levels:
      "1":
        requirements:
          - secret_weapons_lab level 1
          - arms_industry level 1
        batch_size: 4
        research:
          # Research program: Guided Missile Program
          western:
            unlock_day: 1
            time: { days: 1, hours: 1, minutes: 30 }
            cost: { supplies: 2500, fuel: 3000, cash: 10000 }
          eastern:
            unlock_day: 1
            time: { days: 1, hours: 1, minutes: 30 }
            cost: { supplies: 2500, fuel: 3000, cash: 10000 }
          european:
            unlock_day: 1
            time: { days: 1, hours: 1, minutes: 30 }
            cost: { supplies: 2500, fuel: 3000, cash: 10000 }
        mobilisation:
          # x4 per mobilisation
          western:
            time: { days: 1 }
            cost: { supplies: 1350, components: 250, fuel: 500, rares: 900, cash: 2225 }
          eastern:
            time: { days: 1 }
            cost: { supplies: 1350, components: 250, fuel: 500, rares: 900, cash: 2225 }
          european:
            time: { days: 1 }
            cost: { supplies: 1350, components: 250, fuel: 500, rares: 900, cash: 2225 }
        daily_upkeep:
          western:
            cost: {}
          eastern:
            cost: {}
          european:
            cost: {}

  chemical_warhead:
    name: Chemical Warhead
    category: Missile
    doctrine:
      - western
      - eastern
      - european
    levels:
      "1":
        requirements:
          - secret_weapons_lab level 2
          - arms_industry level 1
        batch_size: 3
        research:
          # Research program: Chemical Weapons Program
          # Tree dependency: requires conventional_warhead (Guided Missile Program) completed
          western:
            unlock_day: 3
            time: { days: 1, hours: 3 }
            cost: { supplies: 3750, fuel: 4000, cash: 12500 }
          eastern:
            unlock_day: 3
            time: { days: 1, hours: 3 }
            cost: { supplies: 3750, fuel: 4000, cash: 12500 }
          european:
            unlock_day: 3
            time: { days: 1, hours: 3 }
            cost: { supplies: 3750, fuel: 4000, cash: 12500 }
        mobilisation:
          # x3 per mobilisation
          western:
            time: { days: 1 }
            cost: { supplies: 850, components: 350, fuel: 625, rares: 625, cash: 2750 }
          eastern:
            time: { days: 1 }
            cost: { supplies: 850, components: 350, fuel: 625, rares: 625, cash: 2750 }
          european:
            time: { days: 1 }
            cost: { supplies: 850, components: 350, fuel: 625, rares: 625, cash: 2750 }
        daily_upkeep:
          western:
            cost: {}
          eastern:
            cost: {}
          european:
            cost: {}

  nuclear_warhead:
    name: Nuclear Warhead
    category: Missile
    doctrine:
      - western
      - eastern
      - european
    levels:
      "1":
        requirements:
          - secret_weapons_lab level 4
          - arms_industry level 1
        batch_size: 2
        research:
          # Research program: Nuclear Weapons Program
          # Tree dependency: requires chemical_warhead (Chemical Weapons Program) completed
          western:
            unlock_day: 5
            time: { days: 1, hours: 4, minutes: 30 }
            cost: { supplies: 5000, fuel: 5000, cash: 15000 }
          eastern:
            unlock_day: 5
            time: { days: 1, hours: 4, minutes: 30 }
            cost: { supplies: 5000, fuel: 5000, cash: 15000 }
          european:
            unlock_day: 5
            time: { days: 1, hours: 4, minutes: 30 }
            cost: { supplies: 5000, fuel: 5000, cash: 15000 }
        mobilisation:
          # x2 per mobilisation
          western:
            time: { days: 1 }
            cost: { supplies: 1500, components: 750, fuel: 750, rares: 1000, cash: 3750 }
          eastern:
            time: { days: 1 }
            cost: { supplies: 1500, components: 750, fuel: 750, rares: 1000, cash: 3750 }
          european:
            time: { days: 1 }
            cost: { supplies: 1500, components: 750, fuel: 750, rares: 1000, cash: 3750 }
        daily_upkeep:
          western:
            cost: {}
          eastern:
            cost: {}
          european:
            cost: {}

  # === MISSILES ===
  # Missiles are research-only units — they are NOT mobilised as units.
  # You mobilise warheads; firing a missile consumes warheads from stock.
  # Warhead cost per launch increases with missile level:
  #   Cruise Missile levels 1–3: 1 warhead per launch (any type)
  #   Cruise Missile levels 4+:  2 warheads per launch (any type)
  # The mobilisation blocks below are structural placeholders (schema requires them).
  # Schema extension needed: warheads_per_launch field.

  conventional_cruise_missile:
